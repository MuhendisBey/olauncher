name: CI Verification

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Hygiene, Tests & WGT Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run secret & privacy hygiene audit
        run: npm run hygiene

      - name: Run architectural & syntax test suite
        run: npm test

      - name: Build & package Tizen WGT
        run: npm run package

      - name: Verify WGT artifact cleanliness
        run: |
          test -f dist/olauncher.wgt
          test -f dist/wgt/config.json
          test "$(ls -1 dist/wgt/assets/wallpapers)" = "default-wallpaper.svg"
          echo "WGT artifact verified clean."
